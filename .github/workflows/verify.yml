name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - name: Validate npm package contents
        run: npm pack --dry-run
      - name: Verify installation into a fresh consumer project
        run: node scripts/verify-consumer.mjs
      - name: Install real SDK integration dependencies
        working-directory: integration/real-sdk
        run: npm install --no-audit --no-fund
      - name: Verify OpenAI Agents and MCP SDK integrations
        working-directory: integration/real-sdk
        run: npm test

  cloudflare-agent-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install official Cloudflare Agents SDK for pilot validation
        working-directory: examples/cloudflare-agent-pilot
        run: npm install --no-save --no-package-lock --ignore-scripts agents @cloudflare/workers-types typescript vitest@^4.1.0 @cloudflare/vitest-plugin wrangler
      - name: Typecheck Cloudflare Agent integration
        working-directory: examples/cloudflare-agent-pilot
        run: npx tsc --project tsconfig.json
      - name: Run pilot security regression tests
        run: node --test test/cloudflare-agent-pilot.test.mjs
      - name: Run real Workers and Durable Object integration tests
        working-directory: examples/cloudflare-agent-pilot
        run: npx vitest run --config vitest.config.mts
