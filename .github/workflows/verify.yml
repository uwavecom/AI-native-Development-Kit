name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - name: Validate npm package contents
        run: npm pack --dry-run
      - name: Verify installation into a fresh consumer project
        run: node scripts/verify-consumer.mjs
      - name: Install real SDK integration dependencies
        working-directory: integration/real-sdk
        run: npm install --no-audit --no-fund
      - name: Verify OpenAI Agents and MCP SDK integrations
        working-directory: integration/real-sdk
        run: npm test
