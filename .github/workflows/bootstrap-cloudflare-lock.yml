name: Bootstrap Cloudflare pilot lockfile (temporary)
on:
  push:
    branches: [feature/cloudflare-agent-pilot]
    paths:
      - .github/workflows/bootstrap-cloudflare-lock.yml
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve dependencies without running package scripts
        working-directory: examples/cloudflare-agent-pilot
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit resolved lockfile to this pilot branch only
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_NAME" = "feature/cloudflare-agent-pilot"
          test -f examples/cloudflare-agent-pilot/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/cloudflare-agent-pilot/package-lock.json
          git commit -m "build(pilot): lock resolved Cloudflare SDK dependencies"
          git push origin HEAD:feature/cloudflare-agent-pilot
